name: StoryForge regression tests
on:
  push:
  pull_request:
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax and run regression tests
        run: bash tests/run-all.sh
